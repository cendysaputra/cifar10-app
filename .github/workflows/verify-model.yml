name: Verify model accuracy

# Mengukur ulang akurasi model CIFAR-10 yang di-commit pada 10.000 gambar uji resmi,
# dengan kode terpisah dari scripts/eval_cifar_test.py.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/verify-model.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install tensorflow-cpu==2.21.0 numpy==2.2.6

      - name: Download CIFAR-10
        run: |
          curl -sSL -o cifar.tar.gz https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
          echo "c58f30108f718f92721af3b95e74349a  cifar.tar.gz" | md5sum -c
          tar xzf cifar.tar.gz

      - name: Evaluate
        run: |
          python - <<'PY'
          import hashlib, pickle
          import numpy as np
          from tensorflow.keras.models import load_model

          path = "model_cnn_cifar10_v5.h5"
          print("sha256", hashlib.sha256(open(path, "rb").read()).hexdigest())
          with open("cifar-10-batches-py/test_batch", "rb") as f:
              d = pickle.load(f, encoding="bytes")
          x = d[b"data"].reshape(-1, 3, 32, 32).transpose(0, 2, 3, 1).astype("float32") / 255.0
          y = np.array(d[b"labels"])
          m = load_model(path, compile=False)
          p = m.predict(x, batch_size=500, verbose=0)
          pf = m.predict(x[:, :, ::-1, :], batch_size=500, verbose=0)
          print(f"single-view: {(p.argmax(1) == y).sum()}/10000")
          print(f"flip-TTA:    {((p + pf).argmax(1) == y).sum()}/10000")
          PY
