name: Train model

# Melatih ulang ResNet-18 CIFAR-10. Resep lengkapnya 200 epoch dan tidak muat
# dalam batas waktu runner GitHub (sekitar 6 jam), jadi workflow ini hanya
# dijalankan manual. Model yang dipakai aplikasi dilatih dengan skrip yang sama
# di luar runner, lalu di-commit bersama perubahan aplikasinya.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Jumlah epoch maksimum
        default: "200"

permissions:
  contents: write

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_FILE: model_cnn_cifar10_v5.h5

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-train.txt

      - name: Train
        run: |
          python train.py \
            --epochs "${{ github.event.inputs.epochs || '200' }}" \
            --time-budget-minutes 300 \
            --output "$MODEL_FILE"

      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODEL_FILE"
          git commit -m "Update trained model (run ${{ github.run_id }})"
          # Branch bisa berubah selama training; rebase dulu agar push tidak ditolak.
          git pull --rebase
          git push
