name: Train model

# Melatih ulang model CIFAR-10 di runner GitHub (dataset diunduh otomatis oleh Keras),
# lalu commit model hasil training kembali ke branch yang sama.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Jumlah epoch maksimum
        default: "40"
  push:
    paths:
      - train.py
      - .github/workflows/train-model.yml

permissions:
  contents: write

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install tensorflow-cpu==2.21.0

      - name: Train
        run: |
          python train.py \
            --epochs "${{ github.event.inputs.epochs || '40' }}" \
            --time-budget-minutes 300 \
            --output model_cnn_cifar10_v3.h5

      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_cnn_cifar10_v3.h5
          git commit -m "Update trained model (run ${{ github.run_id }})"
          git push
